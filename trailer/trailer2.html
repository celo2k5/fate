<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800;900&family=Permanent+Marker&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--ink:#0b0516;--ivory:#f2eeff;--mint:#4dffc3;--mag:#ff3da6}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:var(--ink);color:var(--ivory)}
#stage{position:absolute;inset:0;overflow:hidden}
.bg{position:absolute;inset:0;overflow:hidden;will-change:transform,filter}
.bg video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shade{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(11,5,22,.1) 30%,rgba(11,5,22,.75) 100%)}
#words{position:absolute;inset:0;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:14px 40px;padding:0 110px;text-align:center}
.w{font-family:"Unbounded";font-weight:900;text-transform:uppercase;letter-spacing:-.03em;line-height:.9;display:inline-block;will-change:transform,opacity;text-shadow:0 10px 60px rgba(11,5,22,.9)}
.w.acc{color:var(--acc,var(--mint))}
.w.slab{font-family:"Permanent Marker";font-weight:400;text-transform:none;letter-spacing:0;color:var(--ink);background:var(--acc,var(--mint));padding:.02em .32em .1em;border-radius:.16em}
#flash{position:absolute;inset:0;pointer-events:none}
#tag{position:absolute;left:110px;bottom:100px;font-family:"JetBrains Mono";text-transform:uppercase;letter-spacing:.18em;font-size:24px;color:rgba(242,238,255,.75)}
#counter{position:absolute;right:110px;bottom:96px;font-family:"Unbounded";font-weight:800;font-size:70px;color:var(--ivory);text-align:right;line-height:1}
#counter small{display:block;font-family:"JetBrains Mono";font-weight:500;font-size:22px;letter-spacing:.18em;color:rgba(242,238,255,.7);margin-bottom:8px}
#meter{position:absolute;left:110px;right:110px;bottom:60px;height:14px;border-radius:7px;background:rgba(242,238,255,.14);overflow:hidden;display:none}
#meter i{display:block;height:100%;background:var(--mint)}
#mark{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px}
.grain{position:absolute;inset:0;pointer-events:none;opacity:.07;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence baseFrequency='.9' numOctaves='2'/></filter><rect width='200' height='200' filter='url(%23n)' opacity='.5'/></svg>")}
#rgb{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;opacity:0}
.bars{position:absolute;left:0;right:0;height:8px;background:rgba(11,5,22,.9);display:none}
</style></head><body>
<div id="stage">
  <div id="bgs"></div>
  <div class="shade"></div>
  <div id="mark"></div>
  <div id="words"></div>
  <div id="tag"></div>
  <div id="counter"></div>
  <div id="meter"><i></i></div>
  <div id="flash"></div>
  <div class="grain"></div>
</div>
<script>
const BEAT = 60/128;                       // 0.46875 s
const b = n => +(n*BEAT).toFixed(4);
const MARK = `<svg width="SIZE" height="SIZE" viewBox="0 0 128 128"><defs><linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#baffea"/><stop offset="1" stop-color="#4dffc3"/></linearGradient></defs><circle cx="64" cy="64" r="60" fill="#140a26" stroke="url(#rim)" stroke-width="5"/><circle cx="64" cy="64" r="46" fill="none" stroke="#4dffc3" stroke-width="2" stroke-dasharray="2 5.2" opacity=".85"/><path d="M64 10v10M64 108v10M10 64h10M108 64h10" stroke="#4dffc3" stroke-width="3" stroke-linecap="round"/><path d="M46 92V36h36M46 62h28" fill="none" stroke="#f2eeff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/><path d="M46 92V36h36M46 62h28" fill="none" stroke="#4dffc3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="46" cy="92" r="6" fill="#4dffc3"/></svg>`;

// Measured narration lengths after trim + 1.12× tempo (seconds). Words are spread across them by character weight.
const VO = { 0:1.37, 1:3.34, 2:3.71, 3:3.0, 4:2.36, 5:1.49, 6:2.11, 7:6.29, 8:3.05 };
function spread(at, dur, words){ const tot=words.reduce((s,w)=>s+w.t.replace(/[^a-z0-9]/gi,'').length+1.5,0); let acc=0; return words.map(w=>{ const len=w.t.replace(/[^a-z0-9]/gi,'').length+1.5; const start=at+dur*(acc/tot); acc+=len; return {...w, at:start}; }); }
const W=(t,o={})=>({t,...o});
// P(sceneAt, [[start,end,[words]],...]) — phrase windows measured from the narration (pauses detected), words spread inside each.
function P(at, phrases){ const out=[]; for(const [s0,s1,ws] of phrases){ out.push(...spread(at+s0, s1-s0, ws)); } return out; }

// Scenes: at (s), bg {v, speed, zoomFrom, zoomTo, rot}, words (timed), extras.
const SCENES = [
  { at:0,       bg:null, mark:true },
  { at:b(2),    bg:{v:'hero',speed:2.2,zf:1.25,zt:1.08,rot:-1.5}, acc:'#4dffc3', words:spread(b(2),VO[0],[W('Every'),W('coin'),W('has a'),W('destiny',{acc:1,size:1.3})]), vo:0 },
  { at:b(6),    bg:{v:'coin',speed:1.6,zf:1.0,zt:1.22,rot:0}, acc:'#4dffc3', words:P(b(6),[[0,0.47,[W("You don't")]],[0.75,1.67,[W('launch'),W('a token.')]],[2.21,3.34,[W('You',{br:1}),W('launch'),W('an'),W('economy.',{acc:1,size:1.45})]]]), vo:1, tag:'fees → vault → destiny → the coin changes' },
  { at:b(14),   cuts:['phoenix','gravity','echo','orbit','phoenix','gravity','echo','orbit'], cutLen:b(1), acc:'#4dffc3', words:P(b(14),[[0.09,0.88,[W('Pick'),W('one'),W('destiny.',{acc:1})]],[1.47,2.17,[W('Sign',{br:1}),W('once.',{acc:1})]],[2.65,3.71,[W('It can',{br:1}),W('never',{slab:1}),W('be changed.')]]]), vo:2 },
  { at:b(23),   bg:{v:'garden',speed:3,zf:1.3,zt:1.0,rot:1}, acc:'#4dffc3', loop:['Create','Trade','Accumulate','Execute'] },
  { at:b(27),   bg:{v:'phoenix',speed:2.6,zf:1.35,zt:1.05,rot:-1}, acc:'#ff6a2b', words:P(b(27),[[0,1.5,[W('Phoenix',{acc:1,size:1.5}),W('buys back',{br:1}),W('& burns',{slab:1})]]]), vo:3, counter:{label:'burned',to:3600000,suffix:' EMBER'} },
  { at:b(34),   bg:{v:'gravity',speed:2.6,zf:1.35,zt:1.05,rot:1}, acc:'#5b8cff', words:P(b(34),[[0,1.37,[W('Gravity',{acc:1,size:1.5}),W('locks liquidity',{br:1})]],[1.92,2.36,[W('forever',{slab:1})]]]), vo:4, counter:{label:'locked',to:0.18,suffix:' SOL',dp:2} },
  { at:b(40),   bg:{v:'echo',speed:2.6,zf:1.35,zt:1.05,rot:-1}, acc:'#c084fc', words:spread(b(40),VO[5],[W('Echo',{acc:1,size:1.5}),W('pays the holders',{br:1}),W('who stay',{slab:1})]), vo:5, counter:{label:'paid out',to:0.29,suffix:' SOL',dp:2} },
  { at:b(44),   bg:{v:'orbit',speed:2.6,zf:1.35,zt:1.05,rot:1}, acc:'#3de3a5', words:P(b(44),[[0,1.09,[W('Orbit',{acc:1,size:1.5}),W('builds a treasury',{br:1})]],[1.27,1.95,[W('that owns itself',{slab:1})]]]), vo:6, counter:{label:'treasury',to:0.36,suffix:' SOL',dp:2} },
  { at:b(50),   bg:{v:'garden',speed:2.2,zf:1.1,zt:1.3,rot:0}, acc:'#4dffc3', words:P(b(50),[[0,1.45,[W('Trading fees'),W('fill the'),W('vault.',{acc:1})]],[2.01,3.03,[W('The protocol',{br:1}),W('spends it.',{acc:1})]],[4.04,4.72,[W('Not the creator.',{br:1,slab:1})]],[5.58,6.29,[W('Not ever.',{slab:1})]]]), vo:7, meter:true },
  { at:b(64),   bg:{v:'observatory',speed:2.2,zf:1.0,zt:1.2,rot:0}, acc:'#4dffc3', words:P(b(64),[[0.91,1.63,[W('Choose'),W('your fate.',{acc:1})]],[2.15,2.49,[W('Fill the vault.',{br:1})]],[2.62,3.05,[W('Live',{br:1,acc:1,size:1.4}),W('with it.',{acc:1,size:1.4})]]]), vo:8 },
  { at:b(71),   bg:null, end:true },
];
const END = b(77); // 36.1 s
const bgs=document.getElementById('bgs'); const vids={};
for(const n of ['hero','coin','phoenix','gravity','echo','orbit','garden','observatory']){const d=document.createElement('div');d.className='bg';d.style.display='none';d.innerHTML=`<video muted playsinline preload="auto" src="${n}.webm"></video>`;bgs.appendChild(d);vids[n]={el:d,v:d.querySelector('video')};}
const wordsEl=document.getElementById('words'), tagEl=document.getElementById('tag'), counterEl=document.getElementById('counter'), meterEl=document.getElementById('meter'), flashEl=document.getElementById('flash'), markEl=document.getElementById('mark');
const ease=x=>1-Math.pow(1-x,3), clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
function seekVideo(v,t){return new Promise(res=>{const d=v.duration||5;const target=clamp(t%d,0,d-0.05);if(Math.abs(v.currentTime-target)<0.001)return res();const done=()=>{v.removeEventListener('seeked',done);res();};v.addEventListener('seeked',done);v.currentTime=target;setTimeout(()=>{v.removeEventListener('seeked',done);res();},800);});}
function showBg(name,lt,cfg,sceneAt,t){
  for(const k in vids) vids[k].el.style.display=k===name?'block':'none';
  const z=cfg.zf+(cfg.zt-cfg.zf)*clamp(lt/2.2); const punch=1+0.18*(1-ease(clamp(lt/0.35)));
  const beatPh=((t/BEAT)%1); const pulse=1+0.06*Math.pow(1-beatPh,4);
  const whip=(1-ease(clamp(lt/0.28)))*(cfg.rot<0?-140:140); vids[name].el.style.transform=`translateX(${whip.toFixed(1)}px) scale(${(z*punch).toFixed(4)}) rotate(${(cfg.rot*clamp(lt/3)).toFixed(3)}deg)`;
  vids[name].el.style.filter=`brightness(${(1.0+0.35*(1-ease(clamp(lt/0.4)))+0.08*Math.pow(1-beatPh,3)).toFixed(3)}) saturate(${pulse.toFixed(3)})`;
  return seekVideo(vids[name].v, 0.6+lt*cfg.speed);
}
function renderWords(scene,t){
  const acc=scene.acc||'#4dffc3'; wordsEl.style.setProperty('--acc',acc); wordsEl.innerHTML='';
  const vis=scene.words.filter(w=>t>=w.at); if(!vis.length) return;
  for(const w of vis){ if(w.br){const br=document.createElement('div');br.style.flexBasis='100%';br.style.height='0';wordsEl.appendChild(br);} const e=document.createElement('span'); e.className='w'+(w.acc?' acc':'')+(w.slab?' slab':''); e.textContent=w.t; const base=(scene.words.length>5?128:150)*(w.size||1); e.style.fontSize=base+'px';
    const a=clamp((t-w.at)/0.22); const last=w===vis[vis.length-1]; const s=last?(1.55-0.55*ease(a)):1; const rot=w.slab?-3:0;
    e.style.opacity=clamp(a*2).toFixed(3); e.style.transform=`scale(${s.toFixed(3)}) rotate(${rot}deg) translateY(${((1-ease(a))*30).toFixed(1)}px)`; e.style.filter=last?`blur(${((1-ease(a))*10).toFixed(1)}px)`:'none'; wordsEl.appendChild(e); }
}
window.seek=async function(t){
  let cur=SCENES[0]; for(const s of SCENES) if(t>=s.at) cur=s; const lt=t-cur.at; const next=SCENES[SCENES.indexOf(cur)+1]; const sceneLen=(next?next.at:END)-cur.at;
  wordsEl.innerHTML=''; tagEl.textContent=''; counterEl.innerHTML=''; meterEl.style.display='none'; markEl.innerHTML=''; flashEl.style.background='transparent'; for(const k in vids) vids[k].el.style.display='none';
  // cold open
  if(cur.mark){ const a=ease(clamp(lt/0.45)); markEl.innerHTML=MARK.replace(/SIZE/g,'240')+`<div class="w" style="font-size:210px;opacity:${clamp((lt-0.45)/0.2)};transform:scale(${(1.6-0.6*ease(clamp((lt-0.45)/0.3))).toFixed(3)})">Fate</div>`; markEl.firstChild.style.transform=`scale(${(0.4+0.6*a).toFixed(3)}) rotate(${((1-a)*-90).toFixed(1)}deg)`; markEl.firstChild.style.opacity=a; }
  if(cur.end){ const a=ease(clamp(lt/0.4)); markEl.innerHTML=`<div style="display:flex;align-items:center;gap:40px;transform:scale(${(1.3-0.3*a).toFixed(3)});opacity:${a}">${MARK.replace(/SIZE/g,'200')}<div class="w" style="font-size:200px">Fate</div></div><div class="w slab" style="font-size:64px;opacity:${clamp((lt-0.5)/0.2)};transform:rotate(-3deg) scale(${(1.4-0.4*ease(clamp((lt-0.5)/0.3))).toFixed(3)})">every coin has a destiny</div><div style="font-family:'JetBrains Mono';letter-spacing:.2em;font-size:30px;margin-top:20px;opacity:${clamp((lt-1)/0.3)}">FATE-LAUNCHPAD.ONRENDER.COM</div><div style="font-family:'JetBrains Mono';letter-spacing:.14em;font-size:18px;color:rgba(242,238,255,.55);opacity:${clamp((lt-1.3)/0.3)}">PHOENIX · GRAVITY · ECHO · ORBIT · SIMNET BUILD · NOT AUDITED · NOT FINANCIAL ADVICE</div>`; flashEl.style.background=`rgba(11,5,22,${clamp((lt-(sceneLen-1))/1).toFixed(3)})`; }
  // backgrounds
  if(cur.bg) await showBg(cur.bg.v, lt, cur.bg, cur.at, t);
  if(cur.cuts){ const i=Math.min(cur.cuts.length-1,Math.floor(lt/cur.cutLen)); const clt=lt-i*cur.cutLen; await showBg(cur.cuts[i], clt, {speed:3,zf:1.4,zt:1.15,rot:i%2?1.5:-1.5}, cur.at+i*cur.cutLen, t); if(lt<cur.cuts.length*cur.cutLen){ const names={phoenix:['Phoenix','#ff6a2b'],gravity:['Gravity','#5b8cff'],echo:['Echo','#c084fc'],orbit:['Orbit','#3de3a5']}; const [n,c]=names[cur.cuts[i]]; const a=ease(clamp(clt/0.18)); tagEl.innerHTML=`<span class="w slab" style="--acc:${c};font-size:110px;transform:rotate(-3deg) scale(${(1.5-0.5*a).toFixed(3)});opacity:${a}">${n}</span>`; } }
  // loop words
  if(cur.loop){ const i=Math.min(3,Math.floor(lt/BEAT)); const a=clamp((lt-i*BEAT)/0.2); wordsEl.style.setProperty('--acc','#4dffc3'); wordsEl.innerHTML=`<span class="w ${i===3?'acc':''}" style="font-size:${i===3?260:220}px;opacity:${clamp(a*2)};transform:scale(${(1.7-0.7*ease(a)).toFixed(3)});filter:blur(${((1-ease(a))*12).toFixed(1)}px)">${cur.loop[i]}</span>`; }
  if(cur.words) renderWords(cur,t);
  if(cur.tag && lt>1.6) tagEl.textContent=cur.tag;
  if(cur.counter){ const p=ease(clamp((lt-0.6)/2.0)); const v=cur.counter.to*p; const s=cur.counter.dp!=null?v.toFixed(cur.counter.dp):(v/1e6).toFixed(2)+'M'; counterEl.innerHTML=`<small>${cur.counter.label}</small>${s}${cur.counter.suffix}`; counterEl.style.opacity=clamp(lt/0.4); }
  if(cur.meter){ meterEl.style.display='block'; meterEl.firstElementChild.style.width=(clamp(lt/4.5)*100).toFixed(1)+'%'; }
  // transitions: flash + rgb split on every scene start, and a soft flash on every beat in the drop
  const sinceCut=lt; const isDrop=t>=b(27)&&t<b(71);
  let flash=0; if(sinceCut<0.07) flash=0.55*(1-sinceCut/0.07); else if(isDrop){ const ph=(t/BEAT)%1; if(ph<0.06) flash=0.18*(1-ph/0.06); }
  if(flash>0 && !cur.end) flashEl.style.background=`rgba(${cur.acc?hexToRgb(cur.acc):'77,255,195'},${flash.toFixed(3)})`;
  const split=sinceCut<0.16 ? (1-sinceCut/0.16)*14 : 0;
  wordsEl.style.filter = split>0 ? `drop-shadow(${split}px 0 0 rgba(255,61,166,.8)) drop-shadow(${-split}px 0 0 rgba(77,255,195,.8))` : 'none';
  const mb=sinceCut<0.2?(1-sinceCut/0.2)*10:0; bgs.style.filter = split>0||mb>0 ? `blur(${mb.toFixed(1)}px) drop-shadow(${split*0.6}px 0 0 rgba(255,61,166,.5))` : 'none';
  return true;
};
function hexToRgb(h){const n=parseInt(h.slice(1),16);return `${n>>16},${(n>>8)&255},${n&255}`;}
window.END=END;
window.ready=Promise.all([document.fonts.ready,...Object.values(vids).map(({v})=>new Promise(r=>{if(v.readyState>=1)r();else{v.addEventListener('loadedmetadata',r);v.addEventListener('error',r);}}))]);
</script>
</body></html>
